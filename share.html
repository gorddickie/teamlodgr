<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TeamLodgr — Group Hotel Link</title>
  <meta name="description" content="Your team's hotel has been selected. Book your room now before they sell out."/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d1b3e;
      --blue: #1a6fd4;
      --blue-light: #3a8af0;
      --white: #ffffff;
      --gray: #f4f6fa;
      --text: #1a1a2e;
      --muted: #6b7280;
    }
    body { font-family: 'Inter', sans-serif; background: var(--gray); color: var(--text); min-height: 100vh; }

    /* ── Nav ── */
    nav {
      background: var(--white);
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 32px;
      display: flex;
      align-items: center;
    }
    nav img { height: 40px; }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, #1a3a70 100%);
      color: white;
      text-align: center;
      padding: 52px 20px 44px;
    }
    .hero h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 900; margin-bottom: 10px; }
    .hero-subtitle { color: #b0c8f0; font-size: 1.05rem; font-weight: 600; }

    /* ── Main container ── */
    .main { max-width: 720px; margin: -30px auto 60px; padding: 0 20px; }

    /* ── Hotel Card ── */
    .hotel-card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }
    .hotel-name { font-size: 1.5rem; font-weight: 800; color: var(--navy); margin-bottom: 10px; }
    .hotel-meta { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
    .hotel-meta span { font-size: 0.9rem; color: var(--muted); font-weight: 500; }

    .availability-bar {
      background: var(--gray);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .avail-count { font-size: 1.4rem; font-weight: 900; color: var(--navy); }
    .avail-label { font-size: 0.85rem; color: var(--muted); }
    .avail-status { font-size: 0.85rem; font-weight: 700; color: #16a34a; }
    .avail-status.low { color: #dc2626; }

    .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 24px; }
    .price { font-size: 2rem; font-weight: 900; color: var(--blue); }
    .price-label { color: var(--muted); font-size: 0.9rem; }

    .btn-book {
      display: block;
      background: var(--blue);
      color: white;
      text-align: center;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn-book:hover { background: var(--blue-light); }

    /* ── Section cards ── */
    .section-card {
      background: white;
      border-radius: 16px;
      padding: 28px 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
      margin-bottom: 24px;
    }
    .section-card h3 { font-size: 1.1rem; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
    .section-card > p, .section-card .section-sub { font-size: 0.88rem; color: var(--muted); margin-bottom: 16px; }

    /* ── Organizer section label ── */
    .organizer-label {
      display: inline-block;
      background: #eff6ff;
      color: var(--blue);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 50px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Form fields ── */
    .field-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .field-group input,
    .field-group textarea {
      padding: 11px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      resize: vertical;
    }
    .field-group input:focus,
    .field-group textarea:focus { border-color: var(--blue); }

    /* ── Already booked row ── */
    .booked-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .booked-row input {
      flex: 1;
      min-width: 200px;
      padding: 11px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }
    .booked-row input:focus { border-color: var(--blue); }
    .btn-booked {
      background: #16a34a;
      color: white;
      border: none;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn-booked:hover { background: #15803d; }

    /* ── Booking status ── */
    .status-inner {
      background: var(--gray);
      border-radius: 12px;
      padding: 18px 20px;
    }
    .status-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .status-count { font-size: 1.3rem; font-weight: 900; color: var(--navy); }
    .status-label { font-size: 0.85rem; color: var(--muted); }
    .progress-track {
      background: #e5e7eb;
      border-radius: 100px;
      height: 10px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 100px;
      background: var(--blue);
      transition: width 0.5s ease;
    }
    .progress-fill.urgent { background: #dc2626; }
    .urgency-tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 50px;
    }
    .urgency-ok   { background: #dcfce7; color: #16a34a; }
    .urgency-warn { background: #fef9c3; color: #b45309; }
    .urgency-crit { background: #fee2e2; color: #dc2626; }

    /* ── Buttons ── */
    .btn-primary {
      background: var(--navy);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #162d5a; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Messages ── */
    .success-msg { color: #16a34a; font-weight: 600; margin-top: 10px; font-size: 0.9rem; }
    .error-msg   { color: #dc2626; font-weight: 600; margin-top: 10px; font-size: 0.9rem; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .footer a { color: var(--blue); text-decoration: none; font-weight: 600; }
    .footer-links a { color: #9ca3af; }

    @media (max-width: 500px) {
      .section-card { padding: 22px 18px; }
      .hotel-card   { padding: 22px 18px; }
      .booked-row   { flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- ── Nav ── -->
<nav>
  <a href="/"><img src="logo.png" alt="TeamLodgr"/></a>
</nav>

<!-- ── Hero ── -->
<div class="hero">
  <h1>Notify Your Team</h1>
  <p class="hero-subtitle" id="hero-subtitle" style="display:none;"></p>
</div>

<div class="main">

  <!-- ── Notify Form ── -->
  <div class="section-card">
    <div id="trip-details" style="margin-bottom:20px; font-size:0.95rem; color:var(--muted);"></div>
    <p class="section-sub">Enter your team's emails below. Each player will receive a direct link to book their room.</p>
    <div class="field-group">
      <input type="text" id="tournament-name" placeholder="Tournament or event name (e.g. 2026 Provincial Championships)"/>
      <input type="text" id="organizer-name" placeholder="Your name"/>
      <input type="email" id="organizer-email" placeholder="Your email (player replies go here)"/>
      <textarea id="team-emails" rows="4" placeholder="Paste your team's emails in any format…"></textarea>
    </div>
    <button class="btn-primary" id="send-invites-btn" onclick="sendInvites()">Send Booking Link to Team →</button>
    <p id="invite-confirm" style="display:none;" class="success-msg">✅ Sent! Each player will receive a link to book their room.</p>
    <p id="invite-error" style="display:none;" class="error-msg"></p>
  </div>

  <!-- ── Footer ── -->
  <div class="footer">
    Powered by <a href="/">TeamLodgr</a> — Group hotel booking made simple<br/>
    <span class="footer-links" style="font-size:0.8rem;">
      <a href="/privacy.html">Privacy Policy</a> &nbsp;·&nbsp;
      <a href="/terms.html">Terms of Service</a>
    </span>
  </div>

</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/supabase.js"></script>

<script>
  // ── URL params ────────────────────────────────────────────────────────────
  const params    = new URLSearchParams(window.location.search);
  const hotelId   = params.get('hotel');
  const hotelName = decodeURIComponent(params.get('name') || 'Your Team Hotel');
  const checkin   = params.get('checkin');
  const checkout  = params.get('checkout');
  const rooms     = parseInt(params.get('rooms') || '1', 10);
  const city      = decodeURIComponent(params.get('city') || '');
  const hotelUrl  = decodeURIComponent(params.get('url') || '');
  const hotelPhoto = decodeURIComponent(params.get('photo') || '');

  // share_token: prefer explicit param, then derive from URL, then generate fresh
  let shareToken = params.get('token');
  if (!shareToken) {
    const raw = [hotelId || hotelName, checkin, checkout, rooms, city].join('|');
    shareToken = btoa(raw).replace(/[^a-zA-Z0-9]/g, '').slice(0, 40);
  }

  const shareUrl = window.location.href;

  // ── State ─────────────────────────────────────────────────────────────────
  let bookingId = null;
  let currentBookingSite = null;
  let currentRoomsAvailable = null;
  let currentPricePerNight = null;
  let currentProviders = [];
  try { currentProviders = JSON.parse(decodeURIComponent(params.get('providers') || '[]')); } catch(e) { currentProviders = []; }

  // ── Populate UI ───────────────────────────────────────────────────────────
  document.getElementById('hero-subtitle').textContent  = hotelName;

  if (checkin && checkout && rooms) {
    const ci = new Date(checkin).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
    const co = new Date(checkout).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById('trip-details').innerHTML =
      `<div style="background:#f4f6fa;border-radius:12px;overflow:hidden;margin-bottom:4px;">
        ${hotelPhoto ? `<img src="${hotelPhoto}" alt="${hotelName}" style="width:100%;height:180px;object-fit:cover;display:block;" onerror="this.style.display='none'"/>` : ''}
        <div style="padding:14px 16px;">
          <div style="font-size:1.15rem;font-weight:800;color:#0d1b3e;margin-bottom:6px;">${hotelName}</div>
          <div style="font-size:0.9rem;color:#6b7280;">📅 ${ci} → ${co} &nbsp;|&nbsp; 🛏️ ${rooms} room${rooms !== 1 ? 's' : ''} needed</div>
        </div>
      </div>`;
  }

  // ── Save / get group booking in Supabase ──────────────────────────────────
  async function ensureBooking() {
    const { data: existing } = await db
      .from('group_bookings')
      .select('id')
      .eq('share_token', shareToken)
      .maybeSingle();

    if (existing) { bookingId = existing.id; return; }

    const payload = {
      hotel_name:   hotelName,
      hotel_url:    hotelUrl || null,
      city:         city || 'Unknown',
      checkin:      checkin || new Date().toISOString().slice(0, 10),
      checkout:     checkout || new Date().toISOString().slice(0, 10),
      rooms_needed: rooms || 1,
      share_token:  shareToken,
    };

    const { data, error } = await db
      .from('group_bookings')
      .insert(payload)
      .select('id')
      .single();

    if (error) {
      console.error('Failed to save group booking:', JSON.stringify(error));
      // Show error in UI so we can debug
      document.getElementById('invite-error').textContent = 'DB error: ' + error.message;
      document.getElementById('invite-error').style.display = 'block';
    } else bookingId = data.id;
  }

  // ── Load live hotel data from API ─────────────────────────────────────────
  async function loadHotelData() {
    if (!hotelId) return;
    try {
      const res  = await fetch(`/api/hotel?id=${hotelId}&checkin=${checkin}&checkout=${checkout}&rooms=${rooms}`);
      const data = await res.json();

      document.getElementById('avail-count').textContent  = data.availableRooms;
      document.getElementById('hotel-price').textContent  = `$${data.pricePerNight}`;
      document.getElementById('book-btn').href            = data.bookingUrl;

      document.getElementById('hotel-meta').innerHTML = `
        <span>⭐ ${data.rating || 'N/A'}</span>
        <span>📍 ${data.address || ''}</span>
        <span>🏨 via ${data.source}</span>
      `;

      if (data.availableRooms < 5) {
        document.getElementById('avail-status').textContent = '⚠️ Almost Full!';
        document.getElementById('avail-status').classList.add('low');
      }
    } catch (e) {
      console.log('Hotel API not connected yet');
    }
  }

  // ── Booking status tracker ────────────────────────────────────────────────
  async function loadBookingStatus() {
    if (!bookingId) return;

    const { data: members, error } = await db
      .from('team_members')
      .select('id, booked_at')
      .eq('booking_id', bookingId);

    if (error || !members || members.length === 0) return;

    // Only show status section when there are team members in the DB
    document.getElementById('status-section').style.display = '';

    const booked     = members.filter(m => m.booked_at).length;
    const pct        = Math.round((booked / rooms) * 100);
    const cappedPct  = Math.min(pct, 100);
    const remaining  = rooms - booked;

    document.getElementById('status-count').textContent    = `${booked} of ${rooms}`;
    document.getElementById('progress-fill').style.width   = cappedPct + '%';

    let urgencyClass, urgencyText, subText;
    if (remaining <= 0) {
      urgencyClass = 'urgency-crit';
      urgencyText  = '🔴 All Filled!';
      subText      = 'All requested rooms have been claimed.';
      document.getElementById('progress-fill').classList.add('urgent');
    } else if (remaining <= Math.ceil(rooms * 0.3)) {
      urgencyClass = 'urgency-warn';
      urgencyText  = '⚠️ Almost Full';
      subText      = `Only ${remaining} room${remaining !== 1 ? 's' : ''} left to fill — book soon!`;
      document.getElementById('progress-fill').classList.add('urgent');
    } else {
      urgencyClass = 'urgency-ok';
      urgencyText  = '✅ On Track';
      subText      = `${remaining} of ${rooms} rooms still need to be booked.`;
    }

    const tag = document.getElementById('urgency-tag');
    tag.className   = 'urgency-tag ' + urgencyClass;
    tag.textContent = urgencyText;
    document.getElementById('status-subtext').textContent = subText;
  }

  // ── Mark as booked ────────────────────────────────────────────────────────
  async function markBooked() {
    const email = document.getElementById('booked-email').value.trim();
    document.getElementById('booked-confirm').style.display = 'none';
    document.getElementById('booked-error').style.display   = 'none';

    if (!email) {
      document.getElementById('booked-error').textContent   = 'Please enter your email.';
      document.getElementById('booked-error').style.display = 'block';
      return;
    }
    if (!bookingId) {
      document.getElementById('booked-error').textContent   = 'Booking not loaded yet — please wait a moment.';
      document.getElementById('booked-error').style.display = 'block';
      return;
    }

    const { data: existing } = await db
      .from('team_members')
      .select('id')
      .eq('booking_id', bookingId)
      .eq('email', email)
      .maybeSingle();

    let memberId = existing?.id;

    if (!memberId) {
      const { data: inserted, error: insertErr } = await db
        .from('team_members')
        .insert({ booking_id: bookingId, email })
        .select('id')
        .single();

      if (insertErr) {
        document.getElementById('booked-error').textContent   = 'Something went wrong. Please try again.';
        document.getElementById('booked-error').style.display = 'block';
        return;
      }
      memberId = inserted.id;
    }

    const { error } = await db
      .from('team_members')
      .update({ booked_at: new Date().toISOString() })
      .eq('id', memberId);

    if (error) {
      document.getElementById('booked-error').textContent   = 'Could not update your status. Please try again.';
      document.getElementById('booked-error').style.display = 'block';
      return;
    }

    document.getElementById('booked-confirm').style.display = 'block';
    document.getElementById('booked-email').value = '';
    setTimeout(loadBookingStatus, 500);
  }

  // ── Send team invites ─────────────────────────────────────────────────────
  async function sendInvites() {
    const rawEmails     = document.getElementById('team-emails').value;
    const tournamentName = document.getElementById('tournament-name').value.trim();
    const organizerName = document.getElementById('organizer-name').value.trim();
    const organizerEmail = document.getElementById('organizer-email').value.trim();
    const btn           = document.getElementById('send-invites-btn');

    document.getElementById('invite-confirm').style.display = 'none';
    document.getElementById('invite-error').style.display   = 'none';

    if (!rawEmails.trim()) {
      document.getElementById('invite-error').textContent   = 'Please enter at least one team email address.';
      document.getElementById('invite-error').style.display = 'block';
      return;
    }
    if (!bookingId) {
      document.getElementById('invite-error').textContent   = 'Booking not ready yet — please wait a moment and try again.';
      document.getElementById('invite-error').style.display = 'block';
      return;
    }

    const emails = rawEmails.split(/[\s,;]+/).map(e => e.trim()).filter(e => e.includes('@'));
    if (emails.length === 0) {
      document.getElementById('invite-error').textContent   = 'No valid email addresses found.';
      document.getElementById('invite-error').style.display = 'block';
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Sending...';

    // Insert team members into Supabase
    for (const email of emails) {
      await db
        .from('team_members')
        .insert({ booking_id: bookingId, email })
        .then(({ error }) => {
          if (error && !error.message.includes('duplicate')) {
            console.warn('Insert team member error:', error.message);
          }
        });
    }

    // Call notify API with organizerEmail for Reply-To
    try {
      const res = await fetch('/api/notify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bookingId,
          shareToken,
          members: emails.map(email => ({ email, name: '' })),
          hotelName,
          checkin,
          checkout,
          shareUrl,
          tournamentName,
          organizerName,
          organizerEmail,
          bookingSite: currentBookingSite || 'Booking.com',
          roomsAvailable: currentRoomsAvailable || null,
          roomsNeeded: rooms,
          pricePerNight: currentPricePerNight || null,
          providers: currentProviders,
        }),
      });

      if (!res.ok) throw new Error(`API error ${res.status}`);

      document.getElementById('invite-confirm').style.display = 'block';
      document.getElementById('team-emails').value            = '';
      loadBookingStatus();
    } catch (e) {
      console.error('Notify API error:', e.message);
      document.getElementById('invite-confirm').textContent   = '✅ Team members saved! (Email delivery pending API setup.)';
      document.getElementById('invite-confirm').style.display = 'block';
    }

    btn.disabled    = false;
    btn.textContent = 'Send Invites to Team';
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  async function init() {
    await ensureBooking();
    await Promise.all([loadHotelData(), loadBookingStatus()]);
  }

  init();
  setInterval(loadHotelData,      300000);
  setInterval(loadBookingStatus,  300000);
</script>

</body>
</html>
