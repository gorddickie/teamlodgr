<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TeamLodgr — Team Notified!</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d1b3e;
      --blue: #1a6fd4;
      --white: #ffffff;
      --gray: #f4f6fa;
      --muted: #6b7280;
    }
    body { font-family: 'Inter', sans-serif; background: #d1d5db; color: var(--navy); min-height: 100vh; }
    nav {
      background: var(--white);
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 32px;
      display: flex;
      align-items: center;
    }
    nav img { height: 40px; }
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, #1a3a70 100%);
      color: white;
      text-align: center;
      padding: 28px 20px 24px;
    }
    .hero h1 { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 900; }
    .main { max-width: 560px; margin: -30px auto 60px; padding: 0 20px; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      text-align: center;
    }
    .icon { font-size: 3.5rem; margin-bottom: 16px; }
    .card h2 { font-size: 1.4rem; font-weight: 800; color: var(--navy); margin-bottom: 10px; }
    .card p  { font-size: 0.95rem; color: var(--muted); line-height: 1.7; margin-bottom: 10px; }
    .detail-box {
      background: var(--gray);
      border-radius: 10px;
      padding: 16px 20px;
      margin: 20px 0;
      text-align: left;
      font-size: 0.9rem;
      color: #374151;
      line-height: 1.8;
    }
    .btn {
      display: inline-block;
      background: var(--navy);
      color: white;
      text-decoration: none;
      padding: 13px 28px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-top: 10px;
    }
    .btn:hover { background: #162d5a; }
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .footer a { color: var(--blue); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

<nav>
  <a href="/"><img src="logo.png" alt="TeamLodgr"/></a>
</nav>

<div class="hero">
  <h1>🏨 TeamLodgr</h1>
</div>

<div class="main">
  <div class="card" id="main-card">
    <div class="icon" id="card-icon">✅</div>
    <h2 id="card-title">Your team has been notified!</h2>
    <p id="card-body">Your team members have been sent a personal link to book their room. You're all set.</p>
    <div class="detail-box" id="detail-box" style="display:none;"></div>
    <a href="/" class="btn">Back to TeamLodgr</a>
  </div>

  <div class="footer">
    Powered by <a href="/">TeamLodgr</a> — Group hotel booking made simple
  </div>
</div>

<script>
  const params      = new URLSearchParams(window.location.search);
  const sent        = parseInt(params.get('sent') || '0', 10);
  const alreadySent = params.get('alreadySent') === '1';
  const shareToken  = params.get('token') || '';

  if (alreadySent) {
    document.getElementById('card-icon').textContent  = 'ℹ️';
    document.getElementById('card-title').textContent = 'Already confirmed';
    document.getElementById('card-body').textContent  = 'Your team was already notified when you clicked confirm the first time. No duplicate emails were sent.';
  } else if (sent > 0) {
    document.getElementById('card-body').textContent =
      `${sent} team member${sent !== 1 ? 's have' : ' has'} been sent a personal link to book their room.`;
  }
</script>
</body>
</html>
