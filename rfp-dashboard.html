<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RFP Dashboard — TeamLodgr</title>
  <meta name="description" content="Manage your hotel bids, compare proposals, and select a winner."/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d1b3e;
      --blue: #1a6fd4;
      --blue-light: #3a8af0;
      --blue-pale: #e8f0fd;
      --white: #ffffff;
      --gray: #f4f6fa;
      --text: #1a1a2e;
      --muted: #6b7280;
    }
    body { font-family: 'Inter', sans-serif; background: #d1d5db; color: var(--text); min-height: 100vh; }

    nav {
      background: var(--white);
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    nav img { height: 40px; }

    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, #1a3a70 100%);
      color: white;
      padding: 32px 32px 24px;
    }
    .hero h1 { font-size: clamp(1.5rem, 3.5vw, 2.2rem); font-weight: 900; margin-bottom: 6px; }
    .hero p { color: #b0c8f0; font-size: 0.95rem; }

    .rfp-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 14px;
    }
    .rfp-meta-item { font-size: 0.88rem; color: #c0d8f8; }
    .rfp-meta-item strong { color: white; }

    .main { max-width: 900px; margin: 0 auto; padding: 32px 20px 60px; }

    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }
    .card h2 { font-size: 1.1rem; font-weight: 800; color: var(--navy); margin-bottom: 16px; }

    /* Hotel bid cards */
    .hotel-bid-card {
      background: var(--gray);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 14px;
      border: 1.5px solid #e5e7eb;
      transition: border-color 0.2s;
    }
    .hotel-bid-card:last-child { margin-bottom: 0; }
    .hotel-bid-card.winner { border-color: #16a34a; background: #f0fdf4; }

    .hotel-bid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .hotel-bid-name { font-size: 1.05rem; font-weight: 800; color: var(--navy); }
    .hotel-bid-email { font-size: 0.82rem; color: var(--muted); }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .badge-pending { background: #fef9c3; color: #b45309; }
    .badge-submitted { background: #dcfce7; color: #16a34a; }
    .badge-declined { background: #fee2e2; color: #dc2626; }
    .badge-winner { background: #16a34a; color: white; }

    .bid-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }
    .bid-detail-item { font-size: 0.88rem; }
    .bid-detail-item .label { color: var(--muted); font-weight: 500; font-size: 0.78rem; margin-bottom: 2px; }
    .bid-detail-item .value { color: var(--navy); font-weight: 700; }

    .bid-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn-sm {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      border: none;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn-sm:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-question { background: var(--blue-pale); color: var(--blue); }
    .btn-question:hover { background: #d8ecff; }
    .btn-winner { background: #16a34a; color: white; }
    .btn-winner:hover { background: #15803d; }

    /* Message modal overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .modal h3 { font-size: 1.1rem; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
    .modal p { color: var(--muted); font-size: 0.88rem; margin-bottom: 16px; }
    .modal textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s;
    }
    .modal textarea:focus { border-color: var(--blue); }
    .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn-cancel { background: var(--gray); color: var(--muted); padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none; font-family: inherit; }
    .btn-send { background: var(--blue); color: white; padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none; font-family: inherit; flex: 1; }
    .btn-send:hover { background: var(--blue-light); }
    .btn-send:disabled { opacity: 0.6; cursor: not-allowed; }

    .modal-status { font-size: 0.88rem; margin-top: 8px; display: none; }
    .modal-status.success { color: #16a34a; }
    .modal-status.error { color: #dc2626; }

    /* Messages inline */
    .msg-thread { margin-top: 12px; padding-top: 12px; border-top: 1px solid #e5e7eb; }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .msg-bubble.from-organizer { background: var(--blue-pale); }
    .msg-bubble.from-hotel { background: white; border: 1px solid #e5e7eb; }
    .msg-meta { font-size: 0.72rem; color: var(--muted); margin-bottom: 3px; font-weight: 600; }

    /* Success banner */
    .success-banner {
      background: #dcfce7;
      border: 1.5px solid #16a34a;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 20px;
      display: none;
    }
    .success-banner h3 { color: #15803d; font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
    .success-banner p { color: #166534; font-size: 0.9rem; }
    .success-banner a { color: var(--blue); font-weight: 700; }

    footer {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      padding: 20px;
    }
    footer a { color: var(--blue); text-decoration: none; font-weight: 600; }

    @media (max-width: 600px) {
      .hero { padding: 24px 20px 20px; }
      .card { padding: 20px 16px; }
      .modal { padding: 24px 20px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/"><img src="logo.png" alt="TeamLodgr"/></a>
</nav>

<div id="hero-section" class="hero" style="display:none;">
  <h1 id="rfp-title">RFP Dashboard</h1>
  <p id="rfp-sub"></p>
  <div class="rfp-meta" id="rfp-meta"></div>
</div>

<div class="main">
  <div id="page-content">
    <div class="card" style="text-align:center;padding:40px;">
      <div style="font-size:1.5rem;margin-bottom:12px;">⏳</div>
      <p style="color:var(--muted);">Loading dashboard…</p>
    </div>
  </div>
</div>

<!-- Message Modal -->
<div class="modal-overlay" id="msg-modal">
  <div class="modal">
    <h3>Ask a Question</h3>
    <p id="modal-hotel-name">Sending message to hotel…</p>
    <textarea id="modal-msg" rows="4" placeholder="e.g. Do you offer a complimentary breakfast package? Can you accommodate late check-out?"></textarea>
    <div id="modal-status" class="modal-status"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-send" id="modal-send-btn" onclick="sendMessage()">Send Message →</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const RFP_ID = params.get('rfp');
const ORG_EMAIL = params.get('email');

let currentModalToken = null;

async function load() {
  if (!RFP_ID) {
    renderError('No RFP ID provided.');
    return;
  }

  try {
    // Load all hotels for this RFP via rfp-load with rfp_id
    const res = await fetch(`/api/rfp-load?rfp_id=${RFP_ID}&email=${encodeURIComponent(ORG_EMAIL || '')}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load');
    render(data);
  } catch(e) {
    renderError(e.message);
  }
}

function renderError(msg) {
  document.getElementById('page-content').innerHTML = `
    <div class="card" style="text-align:center;padding:40px;">
      <div style="font-size:2rem;margin-bottom:12px;">❌</div>
      <h2 style="color:var(--navy);margin-bottom:8px;">Not Found</h2>
      <p style="color:var(--muted);">${msg}</p>
    </div>`;
}

function fmt(dateStr) {
  if (!dateStr) return '—';
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
}

function statusBadge(status) {
  const map = { pending: 'badge-pending', submitted: 'badge-submitted', declined: 'badge-declined', winner: 'badge-winner' };
  const labels = { pending: '⏳ Pending', submitted: '✅ Bid Received', declined: '❌ Declined', winner: '🏆 Winner' };
  return `<span class="badge ${map[status] || 'badge-pending'}">${labels[status] || status}</span>`;
}

function render({ rfp, hotels }) {
  // Show hero
  document.getElementById('hero-section').style.display = 'block';
  document.getElementById('rfp-title').textContent = rfp.event_name;
  document.getElementById('rfp-sub').textContent = `Organizer: ${rfp.organizer_name || rfp.organizer_email}`;
  document.getElementById('rfp-meta').innerHTML = `
    <div class="rfp-meta-item">📅 Check-In: <strong>${fmt(rfp.check_in)}</strong></div>
    <div class="rfp-meta-item">📅 Check-Out: <strong>${fmt(rfp.check_out)}</strong></div>
    <div class="rfp-meta-item">🛏️ Rooms: <strong>${rfp.rooms_needed}</strong></div>
    <div class="rfp-meta-item">📊 Status: <strong>${rfp.status.toUpperCase()}</strong></div>
  `;

  const awarded = rfp.status === 'awarded';

  const hotelCards = hotels.map(h => {
    const isWinner = h.bid_status === 'winner';
    const hasSubmitted = h.bid_status === 'submitted' || isWinner;
    const bid = h.bid;
    const messages = h.messages || [];

    const messagesHtml = messages.length > 0
      ? `<div class="msg-thread">
          ${messages.map(m => `
            <div class="msg-bubble from-${m.sender}">
              <div class="msg-meta">${m.sender === 'organizer' ? '📋 You' : '🏨 ' + h.hotel_name} · ${new Date(m.created_at).toLocaleString()}</div>
              ${m.message}
            </div>`).join('')}
        </div>`
      : '';

    const bidDetailsHtml = bid ? `
      <div class="bid-details">
        <div class="bid-detail-item"><div class="label">Nightly Rate</div><div class="value" style="color:var(--blue);font-size:1.1rem;">$${bid.nightly_rate}/night</div></div>
        <div class="bid-detail-item"><div class="label">Total Estimate</div><div class="value">${bid.total_estimate ? '$' + bid.total_estimate : '—'}</div></div>
        <div class="bid-detail-item"><div class="label">Cutoff Date</div><div class="value">${fmt(bid.cutoff_date)}</div></div>
        ${bid.perks ? `<div class="bid-detail-item" style="grid-column:1/-1;"><div class="label">Perks</div><div class="value" style="font-weight:600;">${bid.perks}</div></div>` : ''}
        ${bid.notes ? `<div class="bid-detail-item" style="grid-column:1/-1;"><div class="label">Notes</div><div class="value" style="font-weight:400;">${bid.notes}</div></div>` : ''}
      </div>` : '';

    const actionsHtml = `<div class="bid-actions">
      <button class="btn-sm btn-question" onclick="openModal('${h.id}', '${h.token}', '${h.hotel_name.replace(/'/g, "\\'")}')">💬 Ask a Question</button>
      ${hasSubmitted && !awarded && !isWinner
        ? `<button class="btn-sm btn-winner" onclick="selectWinner('${rfp.id}', '${h.id}', '${ORG_EMAIL}')">🏆 Select as Winner</button>`
        : ''}
    </div>`;

    return `
      <div class="hotel-bid-card${isWinner ? ' winner' : ''}" id="hotel-card-${h.id}">
        <div class="hotel-bid-header">
          <div>
            <div class="hotel-bid-name">${h.hotel_name}</div>
            <div class="hotel-bid-email">${h.hotel_email}</div>
          </div>
          ${statusBadge(isWinner ? 'winner' : h.bid_status)}
        </div>
        ${hasSubmitted ? bidDetailsHtml : '<p style="color:var(--muted);font-size:0.88rem;">Awaiting bid submission from hotel.</p>'}
        ${messagesHtml}
        ${actionsHtml}
      </div>`;
  }).join('');

  const successBanner = awarded ? `
    <div class="success-banner" id="award-banner" style="display:block;">
      <h3>🎉 Winner Selected!</h3>
      <p>The winning hotel has been notified. Now invite your team to book their rooms.
      <br/><a href="/share.html?hotel=rfp&rfp=${rfp.id}">→ Share hotel booking link with your team</a></p>
    </div>` : '<div class="success-banner" id="award-banner"></div>';

  document.getElementById('page-content').innerHTML = `
    ${successBanner}
    <div class="card">
      <h2>🏨 Hotel Bids (${hotels.length})</h2>
      ${hotelCards || '<p style="color:var(--muted);">No hotels added to this RFP.</p>'}
    </div>
    <footer>Powered by <a href="/">TeamLodgr</a> — Group hotel booking made simple</footer>
  `;
}

function openModal(hotelId, token, hotelName) {
  currentModalToken = token;
  document.getElementById('modal-hotel-name').textContent = `Sending to: ${hotelName}`;
  document.getElementById('modal-msg').value = '';
  document.getElementById('modal-status').style.display = 'none';
  document.getElementById('modal-send-btn').disabled = false;
  document.getElementById('modal-send-btn').textContent = 'Send Message →';
  document.getElementById('msg-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('msg-modal').classList.remove('active');
}

async function sendMessage() {
  const btn = document.getElementById('modal-send-btn');
  const statusEl = document.getElementById('modal-status');
  const text = document.getElementById('modal-msg').value.trim();

  if (!text) return;

  btn.disabled = true;
  btn.textContent = 'Sending…';
  statusEl.style.display = 'none';

  try {
    const res = await fetch('/api/rfp-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: currentModalToken, sender: 'organizer', message: text }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');

    statusEl.textContent = '✅ Message sent!';
    statusEl.className = 'modal-status success';
    statusEl.style.display = 'block';
    setTimeout(() => { closeModal(); load(); }, 1200);
  } catch(e) {
    statusEl.textContent = '❌ ' + e.message;
    statusEl.className = 'modal-status error';
    statusEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Send Message →';
  }
}

async function selectWinner(rfpId, rfpHotelId, organizerEmail) {
  if (!confirm('Select this hotel as the winner? All hotels will be notified.')) return;

  try {
    const res = await fetch('/api/rfp-accept', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rfp_id: rfpId, rfp_hotel_id: rfpHotelId, organizer_email: organizerEmail }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    load(); // Reload to show updated state
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

// Close modal on overlay click
document.getElementById('msg-modal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('msg-modal')) closeModal();
});

load();
</script>
</body>
</html>
